# jrr.lol 反扒 / 限速（新增文件，仅由 jrr.lol.conf 的 extension include 加载，不影响其它站点）
# req_all zone 已在主配置 http 块定义: limit_req_zone ... zone=req_all:20m rate=15r/s;
limit_req zone=req_all burst=24 nodelay;
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
